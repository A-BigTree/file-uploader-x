[workspace]
members = ["file_uploader_sdk", "file_uploader_core", "uploader_example_plugin", "file_uploader_plugins"]
resolver = "3"

[workspace.package]
version =   "0.1.0"
authors = ['abigtree']

[workspace.dependencies]
file_uploader_sdk = { path = "file_uploader_sdk" }
file_uploader_core = { path = "file_uploader_core" }
file_uploader_plugins = { path = "file_uploader_plugins" }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
chrono = "0.4.44"
stabby = { version = "72.1.2-rc1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
libloading = "0.9.0"
regex = "1.11"
